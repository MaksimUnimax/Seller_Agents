name: Prettier C2.2-D1 Probe

on:
  push:
    branches:
      - probe/prettier-c2-2d1-2026-09-17

permissions:
  contents: read

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.34.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.20.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Print exact Prettier 3.6.2 diff
        shell: bash
        run: |
          pnpm exec prettier --write packages/server/entitlements/src/seller-agents-capability-permissions.test.ts
          git diff -- packages/server/entitlements/src/seller-agents-capability-permissions.test.ts
