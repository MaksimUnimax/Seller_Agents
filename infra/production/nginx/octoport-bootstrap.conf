# Octoport DOMAIN-D2 ACME bootstrap.
# Installed temporarily before the certificate exists.
# It must coexist with the existing docs.selleragents.ru ingress.

server {
    listen 80;
    server_name octoport.ru www.octoport.ru app.octoport.ru api.octoport.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/octoport-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    # Do not expose a fake application before production deployment.
    location / {
        return 404;
    }
}
