# Octoport DOMAIN-D2 pre-deployment ingress.
# This file intentionally does NOT proxy to portal/API because production
# applications are not deployed yet. It only establishes correct HTTPS,
# canonical redirects, and explicit unavailable responses.

server {
    listen 80;
    server_name octoport.ru www.octoport.ru app.octoport.ru api.octoport.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/octoport-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.octoport.ru;

    ssl_certificate /etc/letsencrypt/live/octoport.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/octoport.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 308 https://octoport.ru$request_uri;
}

server {
    listen 443 ssl;
    server_name octoport.ru;

    ssl_certificate /etc/letsencrypt/live/octoport.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/octoport.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Retry-After "3600" always;

    default_type text/plain;
    return 503 "Octoport site is not deployed yet.\n";
}

server {
    listen 443 ssl;
    server_name app.octoport.ru;

    ssl_certificate /etc/letsencrypt/live/octoport.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/octoport.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Retry-After "3600" always;

    default_type text/plain;
    return 503 "Octoport portal is not deployed yet.\n";
}

server {
    listen 443 ssl;
    server_name api.octoport.ru;

    ssl_certificate /etc/letsencrypt/live/octoport.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/octoport.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Retry-After "3600" always;

    default_type application/json;
    return 503 '{"error":"service_not_deployed"}\n';
}
